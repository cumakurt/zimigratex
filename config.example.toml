# Configuration is optional. zimigrate always executes on the local Zimbra server.
[source]
zimbra_user = "zimbra"
command_timeout_seconds = 300
mailbox_timeout_seconds = 14400
mailbox_admin_scheme = "https"
mailbox_admin_port = 7071

[target]
zimbra_user = "zimbra"
command_timeout_seconds = 300
mailbox_timeout_seconds = 14400
mailbox_admin_scheme = "https"
mailbox_admin_port = 7071

[transfer]
workers = 8
retries = 3
retry_base_seconds = 1.0
include_domains = true
include_cos = true
include_accounts = true
include_mailboxes = true
include_distribution_lists = true
# Global and per-server LDAP snapshots are not exported. Host names, certificates,
# ports, and LDAP/MTA topology stay on each installation.
include_system_mailboxes = false
include_secrets = true
account_include = ["*"]
account_exclude = []
# Optional. Prefer CLI --user / --domain for one-account or one-domain backups.
target_users = []
target_domains = []

# "full" is most complete. For very large mailboxes, "year-chunks" reduces the
# blast radius of a broken archive at the cost of additional Zimbra REST requests.
mailbox_mode = "full"
# ZIP with meta=1 includes calendar, tasks, contacts, mail, and briefcase content.
mailbox_format = "zip"
mailbox_lock = true
mailbox_start_year = 1970
mailbox_chunk_years = 5

[import]
# Empty accepts any local Zimbra release that passes command preflight.
# Set a regex only when the destination must match a specific version string.
expected_target_version_pattern = ""
existing_policy = "merge"
mailbox_conflict_resolution = "skip"
# Stop on an unsupported target attribute by default. Set false only after reviewing
# reports/import-warnings.ndjson; infrastructure errors still stop the import.
strict_attributes = true
import_system_accounts = false
# A local process cannot inspect remote mailbox/index volumes. Keep this false.
# Set true only after independently checking every host named below.
allow_unverified_remote_capacity = false
# default_mailhost = "new-zimbra.example.com"

[import.mailhost_map]
# "old-mailbox-1.example.com" = "new-mailbox-1.example.com"
