[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zimigrate"
version = "0.1.0"
description = "Resumable, encrypted Zimbra-to-Zimbra migration tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Cuma KURT" }]
maintainers = [{ name = "Cuma KURT" }]
dependencies = ["cryptography>=42", "rich>=13.9,<16"]

[project.urls]
Homepage = "https://github.com/cumakurt/zimigratex"
Repository = "https://github.com/cumakurt/zimigratex"
Issues = "https://github.com/cumakurt/zimigratex/issues"

[project.scripts]
zimigrate = "zimigrate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
